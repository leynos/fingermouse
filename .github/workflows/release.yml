name: Release Binary

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            ext: ""
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            ext: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Cache cross binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}
      - name: Install cross
        run: cargo install cross --version "0.2.5"
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build release binary
        # A release is built with the platform linker and without the build
        # standard's nightly-only flags: an assigned RUSTFLAGS displaces every
        # `rustflags` table in .cargo/config.toml (cross passes it into the
        # container). The value is what the toolchain action exports anyway.
        env:
          RUSTFLAGS: -D warnings
        run: cross +stable build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        run: |
          mkdir -p artifacts/linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/${{ env.REPO_NAME }}${{ matrix.ext }} \
            artifacts/linux-${{ matrix.arch }}/${{ env.REPO_NAME }}-${{ matrix.target }}${{ matrix.ext }}
          sha256sum artifacts/linux-${{ matrix.arch }}/${{ env.REPO_NAME }}-${{ matrix.target }}${{ matrix.ext }} > \
            artifacts/linux-${{ matrix.arch }}/${{ env.REPO_NAME }}-${{ matrix.target }}${{ matrix.ext }}.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.target }}
          path: artifacts/linux-${{ matrix.arch }}

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        # A release is built with the platform linker and without the build
        # standard's nightly-only flags: an assigned RUSTFLAGS displaces every
        # `rustflags` table in .cargo/config.toml (cross passes it into the
        # container). The value is what the toolchain action exports anyway.
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        run: |
          mkdir -p artifacts/macos-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/${{ env.REPO_NAME }} \
            artifacts/macos-${{ matrix.arch }}/${{ env.REPO_NAME }}-${{ matrix.target }}
          shasum -a 256 artifacts/macos-${{ matrix.arch }}/${{ env.REPO_NAME }}-${{ matrix.target }} > \
            artifacts/macos-${{ matrix.arch }}/${{ env.REPO_NAME }}-${{ matrix.target }}.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.target }}
          path: artifacts/macos-${{ matrix.arch }}

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          profile: minimal
          override: true
      - name: Add target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}
      - name: Build release binary
        shell: pwsh
        # A release is built with the platform linker and without the build
        # standard's nightly-only flags: an assigned RUSTFLAGS displaces every
        # `rustflags` table in .cargo/config.toml (cross passes it into the
        # container). The value is what the toolchain action exports anyway.
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows-${{ matrix.arch }} | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${env:REPO_NAME}.exe" "artifacts/windows-${{ matrix.arch }}/${env:REPO_NAME}-${{ matrix.target }}.exe"
          $hash = Get-FileHash "artifacts/windows-${{ matrix.arch }}/${env:REPO_NAME}-${{ matrix.target }}.exe" -Algorithm SHA256
          ($hash.Hash + "  ${env:REPO_NAME}-${{ matrix.target }}.exe") | Set-Content -Encoding ASCII "artifacts/windows-${{ matrix.arch }}/${env:REPO_NAME}-${{ matrix.target }}.exe.sha256"
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.target }}
          path: artifacts/windows-${{ matrix.arch }}

  build-freebsd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-freebsd
            artifact_suffix: freebsd-amd64
          - arch: arm64
            target: aarch64-unknown-freebsd
            artifact_suffix: freebsd-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc  # v1.5.9
        with:
          release: '13.2'
          arch: ${{ matrix.arch }}
          prepare: |
            pkg install -y rust
          run: |
            cd /workdir
            # The VM's packaged Rust is stable, so the build standard's
            # nightly-only flags in .cargo/config.toml must not reach it:
            # an assigned (even empty) RUSTFLAGS displaces them.
            RUSTFLAGS='' cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        run: |
          mkdir -p artifacts/${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/${{ env.REPO_NAME }} \
            artifacts/${{ matrix.artifact_suffix }}/${{ env.REPO_NAME }}-${{ matrix.target }}
          sha256sum artifacts/${{ matrix.artifact_suffix }}/${{ env.REPO_NAME }}-${{ matrix.target }} > \
            artifacts/${{ matrix.artifact_suffix }}/${{ env.REPO_NAME }}-${{ matrix.target }}.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.target }}
          path: artifacts/${{ matrix.artifact_suffix }}

  build-openbsd:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-openbsd
            artifact_suffix: openbsd-amd64
          - arch: arm64
            target: aarch64-unknown-openbsd
            artifact_suffix: openbsd-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - name: Build on OpenBSD
        uses: vmactions/openbsd-vm@5f7b2c933b8846a138361d6843c52af4bef5d945  # v1.4.8
        with:
          release: '7.4'
          arch: ${{ matrix.arch }}
          prepare: |
            pkg_add -I rust
          run: |
            cd /workdir
            # The VM's packaged Rust is stable, so the build standard's
            # nightly-only flags in .cargo/config.toml must not reach it:
            # an assigned (even empty) RUSTFLAGS displaces them.
            RUSTFLAGS='' cargo build --release --target ${{ matrix.target }}
      - name: Prepare artifact
        run: |
          mkdir -p artifacts/${{ matrix.artifact_suffix }}
          cp target/${{ matrix.target }}/release/${{ env.REPO_NAME }} \
            artifacts/${{ matrix.artifact_suffix }}/${{ env.REPO_NAME }}-${{ matrix.target }}
          sha256sum artifacts/${{ matrix.artifact_suffix }}/${{ env.REPO_NAME }}-${{ matrix.target }} > \
            artifacts/${{ matrix.artifact_suffix }}/${{ env.REPO_NAME }}-${{ matrix.target }}.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ env.REPO_NAME }}-${{ matrix.target }}
          path: artifacts/${{ matrix.artifact_suffix }}

  release:
    needs:
      - build-linux
      - build-macos
      - build-windows
      - build-freebsd
      - build-openbsd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts
      - run: |
          for dir in artifacts/${{ env.REPO_NAME }}-*; do
            for file in "$dir"/*; do
              gh release upload "${{ github.ref_name }}" "$file"
            done
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends finger
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          install-mold: 'true'
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          version: '0.6.0'
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Spelling
        run: make spelling
      - name: Workflow contracts
        run: make workflow-contracts
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@ff1dd759dfffc0db3459e30e833f52437ee62b57
      - name: Lint
        run: make lint
      # Coverage here serves the local ratchet and nothing else: the report is
      # not archived and CodeScene is never called. coverage-main.yml writes
      # the baseline this compares against and owns the CodeScene upload, so
      # the selection below must match that workflow's field for field.
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'

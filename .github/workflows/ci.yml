name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends finger
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6e99f225cb06684f9e6f89b63a7ca4a04095c067
        with:
          install-mold: 'true'
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@6e99f225cb06684f9e6f89b63a7ca4a04095c067
        with:
          version: '0.6.1'
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Spelling
        run: make spelling
      - name: Workflow contracts
        run: make workflow-contracts
      - name: Install the Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@5a99aed78ce68dcebd3052b75c31e6f173162b1e
      - name: Install uv for the docstring-coverage gate
        # `make lint` runs interrogate through `uv tool run`.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Some repositories hold each cached path to exactly one owner; this step only needs the binary.
          enable-cache: false
      - name: Lint
        run: make lint
      # Coverage here serves the local ratchet and nothing else: the report is
      # not archived and CodeScene is never called. coverage-main.yml writes
      # the baseline this compares against and owns the CodeScene upload, so
      # the selection below must match that workflow's field for field.
      - name: Test and Measure Coverage
        env:
          # One of the two exclusions from the build standard: a coverage build is
          # a measurement, so it takes neither the parallel frontend nor the mold
          # linker. Assigning RUSTFLAGS displaces every `rustflags` table in
          # .cargo/config.toml.
          RUSTFLAGS: -D warnings
        uses: leynos/shared-actions/.github/actions/generate-coverage@6e99f225cb06684f9e6f89b63a7ca4a04095c067
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'

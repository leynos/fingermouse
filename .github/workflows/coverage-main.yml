name: Coverage (main)

# Main owns both persistent coverage outputs: the ratchet baseline and the
# CodeScene upload. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene, and
# the CV-005 contract tests under tests/workflow_contracts hold that shape.
#
# The CodeScene call is what moves here, not the archive: the shared uploader
# pins the cs-coverage archive by digest, but the tool talks to CodeScene's API
# and refuses to run when that answer changes shape. Keeping the call on the
# trunk keeps such a change off every pull request's critical path.

on:
  push:
    branches: [main]
  # A dispatch measures on demand. Merges made by the Dependabot automerge
  # workflow with GITHUB_TOKEN fire no push event, so they reach this
  # publisher only through a dispatch or the next ordinary push. A dispatch on
  # main uploads a fresh report, but the shared action writes a new baseline
  # only on a push to refs/heads/main, so the ratchet catches up at the next
  # push. The upload step checks the ref, so a dispatch aimed at a branch
  # neither moves the baseline nor publishes that branch's coverage.
  workflow_dispatch:

# Never cancelled, and keyed on the ref alone. A cancelled run abandons its
# upload and its baseline write. With one group per ref, runs never overlap and
# a newer trigger replaces any run still pending, so uploads land in commit
# order and the newest baseline wins. A dispatch that replaces a pending push
# uploads the same or a newer commit, but leaves the baseline one push behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends finger
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@dbe2e22ceaf498d85512679ccded38be9dbe7777
      # The selection is the baseline every pull request's ratchet is measured
      # against, so ci.yml's must match it field for field.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Actions evaluates the expression before the shell runs, so this writes
      # `available=true` or `available=false` and binds the token nowhere. A
      # fork without the secret skips the upload rather than failing.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # The uploader is a composite action that would pass a step `env` to its
      # nested steps, so the token travels only as its input. The ref check is
      # what stops a dispatch from a branch uploading that branch's coverage.
      - name: Upload coverage data to CodeScene
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
